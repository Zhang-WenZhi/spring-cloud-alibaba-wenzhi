<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphQL 探索工具</title>
    <!-- 引入必要的依赖 -->
    <script src="https://cdn.bootcdn.net/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.bootcdn.net/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.bootcdn.net/graphiql@3.0.0/graphiql.min.js"></script>
    <script src="https://cdn.bootcdn.net/@graphiql/plugin-explorer@5.1.1/dist/index.umd.js"></script>

    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 自定义样式 -->
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --secondary-light: #f472b6;
            --dark: #1e1b4b;
            --light: #f8fafc;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --danger: #ef4444;
            --border-radius: 8px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a103c 0%, #2d1b69 100%);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .app-header {
            background: rgba(30, 27, 75, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            background: linear-gradient(90deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        .app-title i {
            font-size: 1.8rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--light);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .graphiql-container {
            flex: 1;
            padding: 1.5rem;
            position: relative;
        }

        #graphiql {
            height: 100%;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 自定义GraphiQL主题 */
        .graphiql-container .editorBar {
            background: rgba(30, 27, 75, 0.6) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .graphiql-container .toolbar-button {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        .graphiql-container .toolbar-button:hover {
            color: white !important;
            background: rgba(255, 255, 255, 0.1) !important;
        }

        .graphiql-container .result-window .CodeMirror {
            background: rgba(15, 23, 42, 0.8) !important;
            color: #e2e8f0 !important;
        }

        .graphiql-container .query-editor .CodeMirror {
            background: rgba(15, 23, 42, 0.9) !important;
            color: #e2e8f0 !important;
        }

        .graphiql-container .variable-editor .CodeMirror {
            background: rgba(15, 23, 42, 0.7) !important;
            color: #e2e8f0 !important;
        }

        .graphiql-container .doc-explorer {
            background: rgba(30, 27, 75, 0.8) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .graphiql-container .doc-explorer-title-bar {
            background: linear-gradient(90deg, var(--primary-dark), var(--dark)) !important;
        }

        .graphiql-container .search-box {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .graphiql-container .search-box input {
            color: var(--light) !important;
        }

        .graphiql-container .type-name {
            color: var(--primary-light) !important;
        }

        .graphiql-container .field-name {
            color: var(--secondary-light) !important;
        }

        .app-footer {
            padding: 1rem 2rem;
            background: rgba(30, 27, 75, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .footer-links {
            margin-top: 0.5rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .footer-links a {
            color: var(--primary-light);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: var(--secondary-light);
        }

        /* 加载动画 */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 0.5rem;
            z-index: 5;
        }

        .loader-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loader-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loader-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .app-header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
            }

            .graphiql-container {
                padding: 1rem 0.5rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 页面头部 -->
    <header class="app-header">
        <div class="app-title">
            <i class="fas fa-layer-group"></i>
            <span>GraphQL 探索工具</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" id="docsBtn">
                <i class="fas fa-book"></i>
                文档
            </button>
            <button class="btn btn-primary" id="runBtn">
                <i class="fas fa-play"></i>
                执行查询
            </button>
        </div>
    </header>

    <!-- 主要内容区 -->
    <main class="graphiql-container">
        <!-- 加载动画 -->
        <div class="loader" id="loader">
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
        </div>

        <!-- GraphiQL 容器 -->
        <div id="graphiql"></div>
    </main>

    <!-- 页脚 -->
    <footer class="app-footer">
        <p>© 2025 GraphQL Service | 版本 1.0.0</p>
        <div class="footer-links">
            <a href="#" target="_blank">API 文档</a>
            <a href="#" target="_blank">使用指南</a>
            <a href="#" target="_blank">问题反馈</a>
        </div>
    </footer>
</div>

<script>
    // 等待DOM加载完成
    document.addEventListener('DOMContentLoaded', function() {
        // 获取元素
        const graphiqlEl = document.getElementById('graphiql');
        const loader = document.getElementById('loader');
        const runBtn = document.getElementById('runBtn');
        const docsBtn = document.getElementById('docsBtn');

        // 创建探索器插件
        const explorerPlugin = GraphiQLPluginExplorer.explorerPlugin();

        // 初始化GraphiQL
        const graphiql = GraphiQL.createGraphiQL({
            fetcher: GraphiQL.createFetcher({
                url: '/graphql'
            }),
            plugins: [explorerPlugin],
            defaultQuery: `# 示例查询
query GetBook($id: ID!) {
bookById(id: $id) {
id
name
pageCount
author {
  id
  firstName
  lastName
}
}
}

# 示例变量
{
"id": "book-1"
}`,
        });

        // 渲染GraphiQL
        graphiql.render(graphiqlEl);

        // 隐藏加载动画
        setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 300);
        }, 800);

        // 绑定按钮事件
        runBtn.addEventListener('click', () => {
            graphiql.executeQuery();
            // 添加按钮点击效果
            runBtn.classList.add('btn-success');
            setTimeout(() => {
                runBtn.classList.remove('btn-success');
            }, 300);
        });

        docsBtn.addEventListener('click', () => {
            graphiql.toggleExplorer();
        });

        // 添加键盘快捷键
        document.addEventListener('keydown', (e) => {
            // Ctrl+Enter 执行查询
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                graphiql.executeQuery();
            }
            // Ctrl+Space 打开文档
            if ((e.ctrlKey || e.metaKey) && e.key === ' ') {
                e.preventDefault();
                graphiql.toggleExplorer();
            }
        });
    });
</script>
</body>
</html>
